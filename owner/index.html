<!doctype html>
<html dir="rtl" lang="ar"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>إدارة العمليات</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#14202b;--mut:#5d6b78;--line:#d9e0e6;--acc:#0b5e8a;--acc2:#e8f2f8;--ok:#1d7a46;--warn:#b25b00;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0f1519;--card:#18212a;--ink:#e8eef3;--mut:#93a3b1;--line:#2b3946;--acc:#5db4e6;--acc2:#1a2c38;--ok:#56c785;--warn:#f0a050;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;padding-bottom:40px}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0;flex:1;min-width:160px}
button,select,input{font:inherit;color:var(--ink)}
button{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:8px 14px;cursor:pointer}
button.ghost{background:var(--acc2);color:var(--acc)}
input,select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
main{max-width:1000px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.v{cursor:pointer}
.v:hover{border-color:var(--acc)}
.v h3{margin:0 0 4px;font-size:16px;direction:ltr;text-align:right}
.mut{color:var(--mut);font-size:13px}
.bar{height:9px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;background:var(--ok)}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}
.kpi div{background:var(--acc2);border-radius:10px;padding:8px 10px}
.kpi b{display:block;font-size:18px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:right;white-space:nowrap;vertical-align:top}
th{color:var(--mut);font-weight:600}
td.w{white-space:normal;min-width:180px}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--acc2)}
.det{background:var(--acc2);border-radius:10px;padding:10px 12px;margin:4px 0;white-space:pre-wrap;font-size:13.5px}
h2{font-size:16px;margin:18px 0 8px}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--acc2);color:var(--acc);font-size:12px}
.tag.ok{color:var(--ok)}.tag.bad{color:var(--bad)}.tag.warn{color:var(--warn)}
.msg{padding:10px;border-radius:10px;background:var(--acc2);margin-bottom:12px}
.msg.err{color:var(--bad)}
.back{margin-bottom:10px}
.upd{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.upd b.t{color:var(--acc)}
[hidden]{display:none!important}
</style></head><body>
<header>
  <h1>إدارة العمليات — تجميع المراكب</h1>
  <button class="ghost" id="bRefresh">تحديث</button>
  <button class="ghost" id="bCsv">تصدير Excel</button>
  <button class="ghost" id="bSet">الإعدادات</button>
</header>
<main>
  <div id="msg" class="msg" hidden></div>
  <section id="setup" class="card" hidden>
    <h2 style="margin-top:0">ربط بالشيت (مرة واحدة)</h2>
    <p class="mut">الصق رابط Web App من Google Apps Script ومفتاح المدير. يُحفظان في متصفحك أنت فقط.</p>
    <div class="row" style="margin-bottom:8px"><label style="flex:1 1 100%">رابط Web App<input id="fUrl" dir="ltr" placeholder="https://script.google.com/macros/s/.../exec"></label></div>
    <div class="row" style="margin-bottom:10px"><label style="flex:1 1 100%">مفتاح المدير (ADMIN_KEY)<input id="fKey" dir="ltr" type="password" autocomplete="off"></label></div>
    <div class="row"><button id="bSave">حفظ واتصال</button><button class="ghost" id="bForget">مسح البيانات المحفوظة</button></div>
  </section>
  <section id="list">
    <div class="tabs"><button id="tVes" class="on">المراكب</button><button id="tWh">المخازن والساحات</button></div>
    <div class="row" style="margin-bottom:12px">
      <input id="q" placeholder="بحث باسم المركب أو العميل أو البضاعة" style="flex:2 1 200px">
      <select id="fSt" style="flex:1 1 120px"><option value="">كل الحالات</option><option value="open">جارية</option><option value="done">منتهية</option></select>
    </div>
    <div id="cards" class="grid"></div>
  </section>
  <section id="detail" hidden></section>
</main>
<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i);};
var CFG_KEY='bm-owner',CACHE_KEY='bm-owner-cache';
var EQ=[['ship','مركب'],['cranesWorking','أوناش عاملة'],['handler','هاندلر'],['bri','بري'],['hose','خرطوم'],['belt','سيور'],['gen','مولد']];
var P_EQ={cranes:'أوناش',excavators:'حفارات',forklifts:'كلاركات',trucks:'قلابات',loaders:'لوادر',hoppers:'هوابر',handlers:'هاندلر',tampers:'تامبر',drums:'درام',belts:'سيور',cranesMobile:'رافعات',kalmar:'كالمر',tagMaster:'تاج ماستر',generators:'مولد'};
var WT={adjust:'ضبط المخزن',load:'شحن لمركب من المخزن',unload:'تفريغ من مركب للمخزن',shift:'شفت من مخزن إلى مخزن'};
var cfg={url:'',key:''},records=[],mode='ves',openVessel=null,fetchedAt='';

function h(tag,attrs,kids){var e=document.createElement(tag);if(attrs)for(var k in attrs){if(k==='text')e.textContent=attrs[k];else if(k==='cls')e.className=attrs[k];else if(k==='on')e.addEventListener('click',attrs[k]);else e.setAttribute(k,attrs[k]);}(kids||[]).forEach(function(c){if(c==null)return;e.appendChild(typeof c==='string'?document.createTextNode(c):c);});return e;}
function num(v){if(v==null)return 0;var s=String(v).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d);}).replace(/٫/g,'.').replace(/[,،\s]/g,'');var n=parseFloat(s);return isFinite(n)?n:0;}
function fmt(n){return Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2});}
function vkey(n){return String(n||'').toUpperCase().replace(/^\s*(M\s*[\/.\-]?\s*V\.?|MV)\s+/,'').replace(/[\s\-_.\/]+/g,' ').trim();}
function sOrd(s){return s==='ليلي'?1:0;}
function cmpRec(a,b){return (a.date<b.date?-1:a.date>b.date?1:0)||(sOrd(a.shift)-sOrd(b.shift))||((a.data.number||0)-(b.data.number||0));}
function dur(x){if(x.from&&x.to){var a=x.from.split(':'),b=x.to.split(':');var m=(+b[0]*60+ +b[1])-(+a[0]*60+ +a[1]);if(m<0)m+=1440;return m/60;}return num(x.hrs);}
function msg(t,err){var m=$('msg');m.hidden=!t;m.textContent=t||'';m.className='msg'+(err?' err':'');}
function loadCfg(){try{var c=JSON.parse(localStorage.getItem(CFG_KEY)||'{}');cfg.url=c.url||'';cfg.key=c.key||'';}catch(e){}}
function saveCfg(){try{localStorage.setItem(CFG_KEY,JSON.stringify(cfg));}catch(e){}}

async function fetchAll(){
  if(!cfg.url||!cfg.key){$('setup').hidden=false;return;}
  msg('جاري التحديث...');
  try{
    var r=await fetch(cfg.url+(cfg.url.indexOf('?')>0?'&':'?')+'action=list&key='+encodeURIComponent(cfg.key),{redirect:'follow'});
    var j=await r.json();
    if(!j.ok){msg(j.error==='key'?'مفتاح المدير غير صحيح.':'تعذر القراءة: '+j.error,true);return;}
    records=j.records||[];fetchedAt=new Date().toLocaleString('ar-EG');
    try{localStorage.setItem(CACHE_KEY,JSON.stringify({at:fetchedAt,records:records}));}catch(e){}
    msg('');$('setup').hidden=true;render();
  }catch(e){
    msg('تعذر الاتصال بالشيت. تأكد من الإنترنت ومن الرابط (يظهر آخر نسخة محفوظة إن وجدت).',true);
    loadCache();render();
  }
}
function loadCache(){try{var c=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');if(c&&c.records){records=c.records;fetchedAt=c.at+' (محفوظة)';}}catch(e){}}

// ---- grouping ----
function group(){
  var V={},W={};
  records.forEach(function(r){
    if(!r||!r.data)return;
    if(r.type==='E'){var k=vkey(r.vessel);if(!k)return;(V[k]=V[k]||{key:k,name:r.vessel,E:[],P:[],M:[]}).E.push(r);}
    else if(r.type==='P'){
      if(r.data.targetType==='warehouse'){var k2=vkey(r.vessel);(W[k2]=W[k2]||{key:k2,name:r.vessel,P:[]}).P.push(r);
        var w=r.data.work;if(w&&(w.type==='load'||w.type==='unload')){(w[w.type]||[]).forEach(function(row){var vk=vkey(row.vessel);if(!vk)return;(V[vk]=V[vk]||{key:vk,name:row.vessel,E:[],P:[],M:[]}).M.push({store:r.vessel,date:r.date,shift:r.shift,kind:w.type,trips:row.trips,qty:row.qty,by:r.preparer});});}
      }else{var k3=vkey(r.vessel);if(!k3)return;(V[k3]=V[k3]||{key:k3,name:r.vessel,E:[],P:[],M:[]}).P.push(r);}
    }
  });
  Object.keys(V).forEach(function(k){var g=V[k];g.E.sort(cmpRec);g.P.sort(cmpRec);var last=g.E[g.E.length-1];g.last=last;if(last){g.name=last.vessel;g.client=last.data.client;g.cargo=last.data.cargo;g.qty=num(last.data.qty);g.total=num(last.data.total);g.rem=g.qty-g.total;}else{g.qty=0;g.total=0;g.rem=0;var lp=g.P[g.P.length-1];if(lp){g.name=lp.vessel;g.client=lp.data.client;g.cargo=lp.data.cargo;}}
    g.lastAt=[].concat(g.E,g.P).reduce(function(m,r){return (r.updatedAt||'')>m?r.updatedAt:m;},'');});
  Object.keys(W).forEach(function(k){W[k].P.sort(cmpRec);var l=W[k].P[W[k].P.length-1];W[k].lastAt=l?l.updatedAt:'';});
  return {V:V,W:W};
}

function stamp(iso){try{return iso?new Date(iso).toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'}):'';}catch(e){return iso||'';}}

// ---- list ----
function render(){
  var g=group();$('detail').hidden=true;$('list').hidden=false;
  if(openVessel){showDetail(openVessel,g);return;}
  var q=$('q').value.trim().toUpperCase(),st=$('fSt').value,box=$('cards');box.textContent='';
  var items=Object.keys(mode==='ves'?g.V:g.W).map(function(k){return (mode==='ves'?g.V:g.W)[k];});
  items.sort(function(a,b){return (b.lastAt||'')<(a.lastAt||'')?-1:1;});
  var n=0;
  items.forEach(function(x){
    var hay=(x.name+' '+(x.client||'')+' '+(x.cargo||'')).toUpperCase();if(q&&hay.indexOf(q)<0)return;
    if(mode==='ves'&&st){var done=x.qty>0&&x.rem<=0;if(st==='done'&&!done)return;if(st==='open'&&done)return;}
    n++;
    var c=h('div',{cls:'card v',on:function(){openVessel=x.key;render();window.scrollTo(0,0);}});
    c.appendChild(h('h3',{text:x.name}));
    if(mode==='ves'){
      c.appendChild(h('div',{cls:'mut',text:[x.client,x.cargo].filter(Boolean).join(' — ')}));
      var pc=x.qty>0?Math.min(100,Math.round(x.total/x.qty*100)):0;
      var b=h('div',{cls:'bar'});var i=h('i');i.style.width=pc+'%';b.appendChild(i);c.appendChild(b);
      c.appendChild(h('div',{text:'تم '+fmt(x.total)+' من '+fmt(x.qty)+' طن ('+pc+'%) — المتبقي '+fmt(x.rem)}));
      c.appendChild(h('div',{cls:'mut',text:x.E.length+' بيان وردية • '+x.P.length+' بيان دوري'+(x.M.length?' • '+x.M.length+' حركة مخزن':'')+' • آخر وصول '+stamp(x.lastAt)}));
    }else{c.appendChild(h('div',{cls:'mut',text:x.P.length+' بيان دوري • آخر وصول '+stamp(x.lastAt)}));}
    box.appendChild(c);
  });
  if(!n)box.appendChild(h('div',{cls:'mut',text:records.length?'لا نتائج.':'لم تصل أي بيانات بعد.'}));
  if(fetchedAt)box.parentNode.appendChild(Object.assign($('stamp')||h('div',{id:'stamp',cls:'mut'}),{textContent:'آخر تحديث للصفحة: '+fetchedAt}));
}

// ---- detail ----
function eqLine(e){return EQ.filter(function(x){return num(e&&e[x[0]])>0;}).map(function(x){return x[1]+' '+e[x[0]];}).join('، ');}
function showDetail(key,g){
  var x=g.V[key],box=$('detail');$('list').hidden=true;box.hidden=false;box.textContent='';
  if(!x){openVessel=null;render();return;}
  box.appendChild(h('button',{cls:'ghost back',text:'← رجوع للمراكب',on:function(){openVessel=null;render();}}));
  var head=h('div',{cls:'card'});head.appendChild(h('h2',{text:x.name,style:'margin:0;direction:ltr;text-align:right'}));
  head.appendChild(h('div',{cls:'mut',text:[x.client,x.cargo,x.last&&x.last.data.berth?'رصيف '+x.last.data.berth:'',x.last&&x.last.data.op].filter(Boolean).join(' — ')}));
  var stopsH=0;x.E.forEach(function(r){(r.data.stops||[]).forEach(function(s){stopsH+=dur(s);});});
  var kp=h('div',{cls:'kpi'});
  [['الكمية الكلية',fmt(x.qty)],['المُنجز',fmt(x.total)],['المتبقي',fmt(x.rem)],['نسبة الإنجاز',x.qty>0?Math.round(x.total/x.qty*100)+'%':'—'],['ساعات التوقف',fmt(stopsH)+' س'],['عدد الورديات',String(x.E.length)]].forEach(function(p){kp.appendChild(h('div',null,[h('span',{cls:'mut',text:p[0]}),h('b',{text:p[1]})]));});
  head.appendChild(kp);
  if(x.last)head.appendChild(h('div',{cls:'mut',text:'آخر بيان: '+x.last.date+' — '+x.last.shift+' — المُعِد: '+(x.last.preparer||'—')}));
  box.appendChild(head);

  // daily
  var days={};x.E.forEach(function(r){var d=days[r.date]=days[r.date]||{d:0,n:0,tot:0};if(r.shift==='ليلي')d.n+=num(r.data.cur);else d.d+=num(r.data.cur);d.tot=Math.max(d.tot,num(r.data.total));});
  var dk=Object.keys(days).sort();
  if(dk.length){box.appendChild(h('h2',{text:'الإنجاز اليومي'}));var t=h('table');t.appendChild(h('tr',null,['التاريخ','نهاري','ليلي','إجمالي اليوم','التراكمي','المتبقي'].map(function(c){return h('th',{text:c});})));
    dk.forEach(function(d){var o=days[d];t.appendChild(h('tr',null,[d,fmt(o.d),fmt(o.n),fmt(o.d+o.n),fmt(o.tot),x.qty?fmt(x.qty-o.tot):'—'].map(function(c){return h('td',{text:c});})));});
    box.appendChild(h('div',{cls:'card tw'},[t]));}

  // shifts
  box.appendChild(h('h2',{text:'بيانات الورديات (اضغط على السطر للتفاصيل)'}));
  var t2=h('table');t2.appendChild(h('tr',null,['التاريخ','الوردية','كمية الوردية','التراكمي','المعدات','توقف','المُعِد','وصل'].map(function(c){return h('th',{text:c});})));
  x.E.forEach(function(r){var d=r.data,sh=0;(d.stops||[]).forEach(function(s){sh+=dur(s);});
    var tr=h('tr',{cls:'click'});[r.date,r.shift,fmt(num(d.cur)),fmt(num(d.total)),eqLine(d.eq),sh?fmt(sh)+' س':'—',r.preparer||'—',stamp(r.updatedAt)].forEach(function(c){tr.appendChild(h('td',{text:c}));});
    var dr=h('tr',{hidden:'hidden'});var td=h('td',{colspan:'8',cls:'w'});td.appendChild(h('div',{cls:'det',text:shiftDetail(d)}));dr.appendChild(td);
    tr.addEventListener('click',function(){dr.hidden=!dr.hidden;});t2.appendChild(tr);t2.appendChild(dr);});
  box.appendChild(h('div',{cls:'card tw'},[t2]));

  // warehouse movements
  if(x.M.length){box.appendChild(h('h2',{text:'حركة المخازن لهذا المركب'}));var t3=h('table');t3.appendChild(h('tr',null,['التاريخ','الوردية','المخزن','النوع','النقلات','الكمية (طن)'].map(function(c){return h('th',{text:c});})));
    x.M.forEach(function(m){t3.appendChild(h('tr',null,[m.date,m.shift,m.store,m.kind==='load'?'شحن من المخزن':'تفريغ إلى المخزن',String(m.trips||0),String(m.qty||0)].map(function(c){return h('td',{text:c});})));});box.appendChild(h('div',{cls:'card tw'},[t3]));}

  // periodic
  box.appendChild(h('h2',{text:'البيانات الدورية (المعدات والمقاولون)'}));
  if(!x.P.length)box.appendChild(h('div',{cls:'mut',text:'لا توجد بيانات دورية لهذا المركب بعد.'}));
  x.P.slice().reverse().forEach(function(r){var u=r.data;var c=h('div',{cls:'upd'});c.appendChild(h('b',{cls:'t',text:'تحديث رقم '+(u.number||'')+' — '+r.date+' — '+r.shift}));
    c.appendChild(h('div',{cls:'mut',text:'المُعِد: '+(r.preparer||'—')+' • '+(u.savedAt||'')+' • وصل '+stamp(r.updatedAt)}));
    c.appendChild(h('div',{cls:'det',text:periodicDetail(u)}));box.appendChild(c);});
}
function shiftDetail(d){
  var L=[];
  L.push('العملية: '+(d.op||'—')+' | رصيف: '+(d.berth||'—')+(d.holds?' | عدد العنابر: '+d.holds:''));
  var stor=(d.stores||[]).filter(function(s){return s&&s.name;}).map(function(s){return s.type+' '+s.name;}).join('، ');if(stor)L.push('التخزين: '+stor);
  EQ.forEach(function(e){var n=num(d.eq&&d.eq[e[0]]),co=d.eqContractors&&d.eqContractors[e[0]];if(n>0||co)L.push(e[1]+': '+n+(co?' — '+co:''));});
  if(d.laborContractor||d.laborCount)L.push('العمالة: '+(d.laborContractor||'')+' — '+(d.laborCount||''));
  (d.factories||[]).forEach(function(f){if(f.name||f.hold)L.push('مصنع علف: '+(f.name||'—')+(f.hold?' — عنبر '+f.hold:'')+(f.qty?' — '+f.qty:''));});
  (d.stops||[]).forEach(function(s,i){L.push('توقف '+(i+1)+': '+(s.equip||'')+' '+(s.no||'')+' — '+(s.reason||'')+' — '+(s.from&&s.to?s.from+' إلى '+s.to:'')+' ('+fmt(dur(s))+' س)');});
  if(d.noteD)L.push('ملاحظات النهار:\n'+d.noteD);if(d.noteN)L.push('ملاحظات الليل:\n'+d.noteN);
  return L.join('\n');
}
function periodicDetail(u){
  var L=[];if(u.holds)L.push('عدد العنابر: '+u.holds);
  (u.factories||[]).forEach(function(f){L.push('مصنع علف: '+(f.name||'—')+(f.hold?' — عنبر '+f.hold:''));});
  Object.keys(P_EQ).forEach(function(k){var e=u.equipment&&u.equipment[k];if(!e)return;var cs=(e.contractors||[]).filter(function(c){return c&&(c.name||c.count||c.codes);});var crew=e.crew&&Object.keys(e.crew).filter(function(z){return num(e.crew[z])>0;}).map(function(z){return z+': '+e.crew[z];}).join('، ');if(!cs.length&&!crew&&!e.crewContractor)return;
    L.push('▪ '+P_EQ[k]+(k==='cranes'&&e.craneType?(e.craneType==='land'?' (بري)':' (مركب)'):''));
    cs.forEach(function(c,i){L.push('   '+(c.kind==='company'?'شركة ':'مقاول ')+(i+1)+': '+(c.name||'—')+' — العدد: '+(c.count||0)+(c.codes?' — الأكواد: '+c.codes:''));});
    if(e.crewContractor)L.push('   مقاول الطاقم: '+e.crewContractor);if(crew)L.push('   الطاقم: '+crew);});
  if(u.work){var w=u.work;L.push('▪ نوع العمل: '+(WT[w.type]||w.type));
    if(w.type==='adjust'&&w.adjust)L.push('   نقلات: '+(w.adjust.trips||0)+' — كمية: '+(w.adjust.qty||0)+' طن');
    else (w[w.type]||[]).forEach(function(r,i){L.push('   '+(i+1)+') '+(w.type==='shift'?'من '+(r.from||'—')+' إلى '+(r.to||'—'):(r.vessel||'—'))+' — نقلات: '+(r.trips||0)+' — كمية: '+(r.qty||0)+' طن');});}
  if(u.transferCount)L.push('إجمالي النقلات: '+u.transferCount);
  if(u.note)L.push('ملاحظة: '+u.note);
  return L.join('\n')||'—';
}

// ---- warehouses detail inside list: reuse card click ----
function showWarehouse(key,g){
  var x=g.W[key],box=$('detail');$('list').hidden=true;box.hidden=false;box.textContent='';
  box.appendChild(h('button',{cls:'ghost back',text:'← رجوع',on:function(){openVessel=null;render();}}));
  box.appendChild(h('h2',{text:x.name}));
  x.P.slice().reverse().forEach(function(r){var u=r.data,c=h('div',{cls:'upd'});c.appendChild(h('b',{cls:'t',text:'تحديث رقم '+(u.number||'')+' — '+r.date+' — '+r.shift}));c.appendChild(h('div',{cls:'mut',text:'المُعِد: '+(r.preparer||'—')+' • وصل '+stamp(r.updatedAt)}));c.appendChild(h('div',{cls:'det',text:periodicDetail(u)}));box.appendChild(c);});
}
var _show=showDetail;showDetail=function(key,g){if(mode==='wh')return showWarehouse(key,g);return _show(key,g);};

// ---- CSV ----
function csvCell(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function exportCsv(){
  var g=group(),rows=[['المركب','العميل','البضاعة','التاريخ','الوردية','كمية الوردية','التراكمي','الكمية الكلية','المتبقي','المعدات','ساعات التوقف','المُعِد']];
  Object.keys(g.V).forEach(function(k){var x=g.V[k];x.E.forEach(function(r){var d=r.data,sh=0;(d.stops||[]).forEach(function(s){sh+=dur(s);});rows.push([x.name,d.client,d.cargo,r.date,r.shift,num(d.cur),num(d.total),num(d.qty),num(d.qty)-num(d.total),eqLine(d.eq),sh,r.preparer]);});});
  var csv='﻿'+rows.map(function(r){return r.map(csvCell).join(',');}).join('\r\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='vessels-'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();setTimeout(function(){a.remove();},500);
}
